<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0c0a1a"/>
  <g transform="translate(60,58)">
    <!-- shield -->
    <path d="M0-38 C26-38 42-26 42-6 C42 18 0 40 0 40 C0 40 -42 18 -42-6 C-42-26 -26-38 0-38Z"
          fill="none" stroke="url(#g)" stroke-width="3.5"/>
    <!-- mic -->
    <rect x="-6" y="-20" width="12" height="18" rx="6" fill="url(#g)" opacity=".8">
      <animate attributeName="height" values="18;20;18" dur="2s" repeatCount="indefinite"/>
    </rect>
    <path d="M-14-4 C-14 8 0 16 0 16 C0 16 14 8 14-4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
    <line x1="0" y1="16" x2="0" y2="26" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
    <line x1="-8" y1="26" x2="8" y2="26" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
    <!-- voice waves -->
    <path d="M18-10 C24-6 24 6 18 10" fill="none" stroke="#f472b6" stroke-width="2" opacity=".5">
      <animate attributeName="opacity" values=".3;.7;.3" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M24-16 C32-8 32 8 24 16" fill="none" stroke="#f472b6" stroke-width="2" opacity=".3">
      <animate attributeName="opacity" values=".2;.6;.2" dur="1.8s" repeatCount="indefinite"/></path>
  </g>
</svg>
