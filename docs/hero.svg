<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a1a"/><stop offset="1" stop-color="#14122a"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <!-- shield outline -->
  <path d="M300 30 C340 30 370 50 370 80 C370 120 300 160 300 160 C300 160 230 120 230 80 C230 50 260 30 300 30Z"
        fill="none" stroke="url(#lg)" stroke-width="2.5" opacity=".5">
    <animate attributeName="stroke-dasharray" values="0 600;600 0" dur="3s" fill="freeze"/>
  </path>
  <!-- mic icon -->
  <g transform="translate(300,85)">
    <rect x="-10" y="-30" width="20" height="28" rx="10" fill="url(#lg)" opacity=".7">
      <animate attributeName="opacity" values=".5;.9;.5" dur="2s" repeatCount="indefinite"/></rect>
    <path d="M-18-6 C-18 12 0 22 0 22 C0 22 18 12 18-6" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
    <line x1="0" y1="22" x2="0" y2="34" stroke="#fff" stroke-width="2" opacity=".6"/>
    <line x1="-10" y1="34" x2="10" y2="34" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- voice waves -->
  <path d="M340 70 C352 80 352 100 340 110" fill="none" stroke="#f472b6" stroke-width="2" opacity=".4">
    <animate attributeName="opacity" values=".2;.6;.2" dur="1.8s" repeatCount="indefinite"/></path>
  <path d="M355 58 C374 74 374 106 355 122" fill="none" stroke="#f472b6" stroke-width="2" opacity=".25">
    <animate attributeName="opacity" values=".15;.45;.15" dur="2.2s" repeatCount="indefinite"/></path>
  <!-- floating dots -->
  <circle cx="120" cy="60" r="4" fill="#c084fc" opacity=".5"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="240" r="3.5" fill="#f472b6" opacity=".4"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="50" r="3" fill="#c084fc" opacity=".3"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
  <text x="300" y="200" font-family="Segoe UI,sans-serif" font-size="22" fill="#f0eaf8" text-anchor="middle" font-weight="800" opacity=".8">
    Her voice. Her career. Her rules.</text>
  <text x="300" y="230" font-family="Segoe UI,sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" opacity=".6">
    voice-first · encrypted · women-only
    <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
